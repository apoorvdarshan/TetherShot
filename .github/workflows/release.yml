# Publishes TetherShot when a version tag is pushed.
#
# Trigger: pushing a tag like `v1.0.6` (which `npm version <patch|minor|major>`
# creates for you). On that tag the workflow:
#   1. verifies the tag matches package.json's version (catches a mis-pushed tag),
#   2. builds, Developer ID-signs, and notarizes a universal DMG,
#   3. publishes the package to npm, and
#   4. creates the matching GitHub Release with the DMG attached.
#
# One-time setup: add NPM_TOKEN plus the Developer ID and Apple notarization
# secrets documented in CONTRIBUTING.md.
name: Release

on:
  push:
    tags:
      - "v*"

# Don't let two tag pushes race each other through publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance (signed, verifiable publish)

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

  dmg:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Require signing and notarization secrets
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          DEVELOPER_ID_APPLICATION_NAME: ${{ secrets.DEVELOPER_ID_APPLICATION_NAME }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for name in CERTIFICATE_P12 CERTIFICATE_PASSWORD DEVELOPER_ID_APPLICATION_NAME ASC_PRIVATE_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done

      - name: Import Developer ID Application certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/tethershot.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          echo "$CERTIFICATE_P12" | /usr/bin/base64 -D > "$CERTIFICATE"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"

      - name: Prepare App Store Connect notarization key
        env:
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_P8" | /usr/bin/base64 -D > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize universal DMG
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION_NAME }}
          NOTARIZE: "1"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$DEVELOPER_ID_APPLICATION" || { echo "::error::Missing DEVELOPER_ID_APPLICATION_NAME"; exit 1; }
          ./script/build_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tethershot-dmg
          path: dist/TetherShot-*-universal.dmg
          if-no-files-found: error

  publish-npm:
    needs: dmg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: [dmg, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tethershot-dmg
          path: dist

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "TetherShot $GITHUB_REF_NAME" --generate-notes --verify-tag --latest
        env:
          GH_TOKEN: ${{ github.token }}
